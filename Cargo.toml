[package]
name = "rfinancial"
version = "1.4.0"
edition = "2024"
include = ["src/**/*", "Cargo.toml", "README.md", "examples/**/*"]
homepage = "https://github.com/seanzian2093/rust-numpy-financial"
description = "A financial crate mimicking `numpy_financial` in Python"
repository = "https://github.com/seanzian2093/rust-numpy-financial"
keywords = ["finance", "mathematics", "investment", "algorithms", "development-tools"]
categories = ["finance", "mathematics"]
license = "MIT"
rust-version = "1.98.1"
authors = ["Sean Zian"]

[badges]
maintenance = { status = "actively-developed"}

[dependencies]
log = "0.4.34"
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "financial_benchmarks"
harness = false

[[bench]]
name = "api_comparison"
harness = false

[profile.bench]
debug = true
